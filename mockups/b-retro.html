<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案B レトロなゲーム箱｜ボードゲーム得点記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f3e8d2; --cream-2:#faf3e4; --navy:#1b2a55; --red:#d0402c; --yellow:#efb42d; --green:#2f7d5c;
  --p1:#d0402c; --p2:#3269c9; --p3:#2f7d5c; --p4:#b06a12;
  --num:"Oswald",Impact,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  color:var(--navy);background:#cfc3a8;display:flex;justify-content:center;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.phone{width:100%;max-width:412px;min-height:100vh;background:var(--cream);position:relative;overflow:hidden}
/* ヘッダ */
header{background:var(--navy);color:var(--cream);padding:16px 18px 14px;border-bottom:4px solid var(--red)}
.title{display:flex;align-items:center;gap:10px}
.title h1{font-size:24px;font-weight:900;letter-spacing:.04em;line-height:1.1}
.title .tag{
  margin-left:auto;background:var(--yellow);color:var(--navy);font-family:var(--num);
  font-size:14px;padding:3px 9px;letter-spacing:.06em;
}
.meta{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.meta span{
  border:2px solid rgba(243,232,210,.5);padding:2px 8px;font-size:11px;letter-spacing:.04em;
}
/* 順位カード */
.standings{padding:16px 14px 6px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:3px solid var(--navy);background:var(--cream-2);padding:10px 11px 9px;position:relative;box-shadow:5px 5px 0 rgba(27,42,85,.2)}
.card.lead{background:var(--yellow);box-shadow:5px 5px 0 var(--navy)}
.card .pos{font-family:var(--num);font-size:13px;letter-spacing:.08em;color:var(--red)}
.card.lead .pos{color:var(--navy)}
.card .nm{font-size:15px;font-weight:700;margin-top:1px;display:flex;align-items:center;gap:6px}
.card .nm i{width:10px;height:10px;display:block}
.card .val{font-family:var(--num);font-size:34px;font-weight:700;line-height:1;margin-top:6px;letter-spacing:.02em}
.card .val small{font-family:inherit;font-size:12px;font-weight:500;margin-left:3px}
/* スコア表 */
.bar{
  margin:18px 14px 0;background:var(--navy);color:var(--cream);
  font-size:12px;letter-spacing:.14em;padding:7px 11px;display:flex;justify-content:space-between;
}
.tableWrap{margin:0 14px;border:3px solid var(--navy);border-top:none;background:var(--cream-2);overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:380px}
thead th{
  background:var(--navy);color:var(--cream);font-size:12px;font-weight:700;
  padding:7px 10px;text-align:right;white-space:nowrap;border-left:1px solid rgba(243,232,210,.25);
}
thead th i{display:inline-block;width:8px;height:8px;margin-right:5px;box-shadow:0 0 0 1px rgba(243,232,210,.6)}
th.rowhead,td.rowhead{
  position:sticky;left:0;background:var(--cream-2);text-align:left;padding:9px 10px;
  font-size:12px;font-weight:700;white-space:nowrap;border-right:3px solid var(--navy);
}
thead th.rowhead{background:var(--navy);color:var(--cream)}
tbody td{
  font-family:var(--num);font-size:19px;font-weight:500;text-align:right;padding:8px 10px;
  border-bottom:2px solid rgba(27,42,85,.18);
}
tbody th.rowhead{border-bottom:2px solid rgba(27,42,85,.18)}
tbody td.minus{color:var(--red);font-weight:700}
tbody td.empty{color:rgba(27,42,85,.28)}
tr.total td{background:var(--navy);color:var(--cream);font-size:22px;font-weight:700;border-bottom:none}
tr.total th.rowhead{background:var(--red);color:var(--cream);border-bottom:none}
/* ボタン */
.actions{padding:18px 14px 0}
.add{
  width:100%;padding:14px;background:var(--red);color:var(--cream);border:3px solid var(--navy);
  font:inherit;font-size:16px;font-weight:700;letter-spacing:.06em;cursor:pointer;
  box-shadow:5px 5px 0 var(--navy);
}
.add:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--navy)}
.foot{display:flex;gap:10px;padding:14px 14px 100px}
.foot button{flex:1;padding:11px;background:transparent;border:3px solid var(--navy);font:inherit;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
/* 入力シート */
.opener{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:var(--yellow);color:var(--navy);border:3px solid var(--navy);padding:10px 16px;
  font:inherit;font-size:13px;font-weight:700;cursor:pointer;z-index:30;box-shadow:4px 4px 0 var(--navy);
}
.scrim{position:fixed;inset:0;background:rgba(27,42,85,.45);display:none;z-index:40}
.scrim.on{display:block}
.input{
  position:fixed;left:50%;transform:translateX(-50%) translateY(102%);bottom:0;width:100%;max-width:412px;
  background:var(--cream-2);border-top:5px solid var(--navy);z-index:50;transition:transform .2s ease;
  padding-bottom:env(safe-area-inset-bottom);
}
.input.on{transform:translateX(-50%) translateY(0)}
.ihead{background:var(--navy);color:var(--cream);display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
.ihead .who{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.ihead .who i{width:10px;height:10px;display:block}
.ihead .rnd{font-family:var(--num);font-size:13px;letter-spacing:.06em;color:var(--yellow)}
.display{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;padding:12px 16px;border-bottom:3px solid var(--navy)}
.display .v{font-family:var(--num);font-size:52px;font-weight:700;line-height:1;color:var(--red)}
.display .u{font-size:13px;font-weight:700}
.quick{display:flex;gap:8px;padding:12px 16px}
.quick button{flex:1;padding:8px 0;border:3px solid var(--navy);background:var(--cream);font-family:var(--num);font-size:16px;color:var(--navy);cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 16px 12px}
.pad button{
  background:var(--cream);border:3px solid var(--navy);padding:12px 0;
  font-family:var(--num);font-size:24px;font-weight:500;color:var(--navy);cursor:pointer;
}
.pad button:active{background:var(--yellow)}
.pad button.sign{background:var(--yellow)}
.pad button.del{font-family:inherit;font-size:14px;font-weight:700}
.ifoot{display:flex;gap:10px;padding:0 16px 16px}
.ifoot .cancel{flex:1;padding:13px;border:3px solid var(--navy);background:transparent;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.ifoot .ok{flex:2;padding:13px;border:3px solid var(--navy);background:var(--green);color:var(--cream);font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:4px 4px 0 var(--navy)}
.note{padding:0 14px 24px;font-size:11px;line-height:1.7;color:rgba(27,42,85,.75)}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="title"><h1>カタン</h1><span class="tag">2026.08.28</span></div>
    <div class="meta"><span>合計で競う</span><span>高い方が勝ち</span><span>単位：点</span></div>
  </header>

  <section class="standings">
    <div class="card lead"><div class="pos">1ST</div><div class="nm"><i style="background:var(--p2)"></i>ゆい</div><div class="val">28<small>点</small></div></div>
    <div class="card"><div class="pos">2ND</div><div class="nm"><i style="background:var(--p1)"></i>あきら</div><div class="val">15<small>点</small></div></div>
    <div class="card"><div class="pos">2ND</div><div class="nm"><i style="background:var(--p3)"></i>けん</div><div class="val">15<small>点</small></div></div>
    <div class="card"><div class="pos">4TH</div><div class="nm"><i style="background:var(--p4)"></i>さとし</div><div class="val">12<small>点</small></div></div>
  </section>

  <div class="bar"><span>スコアシート</span><span>← 横スクロール</span></div>
  <div class="tableWrap">
    <table>
      <thead><tr>
        <th class="rowhead">回</th>
        <th><i style="background:var(--p1)"></i>あきら</th>
        <th><i style="background:var(--p2)"></i>ゆい</th>
        <th><i style="background:var(--p3)"></i>けん</th>
        <th><i style="background:var(--p4)"></i>さとし</th>
      </tr></thead>
      <tbody>
        <tr><th class="rowhead">第1回</th><td>12</td><td>8</td><td class="minus">−3</td><td>5</td></tr>
        <tr><th class="rowhead">第2回</th><td>5</td><td>14</td><td>7</td><td class="minus">−2</td></tr>
        <tr><th class="rowhead">第3回</th><td class="minus">−2</td><td>6</td><td>11</td><td>9</td></tr>
        <tr><th class="rowhead">第4回</th><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td></tr>
        <tr class="total"><th class="rowhead">合計</th><td>15</td><td>28</td><td>15</td><td>12</td></tr>
      </tbody>
    </table>
  </div>

  <div class="actions"><button class="add">＋ 第5回を追加</button></div>
  <div class="foot"><button>ひとつ戻す</button><button>ゲームを終える</button></div>
  <p class="note">案B｜太い罫・角ゼロ・朱／紺／黄の3色。ボタンには硬いオフセット影を付けて、押せる物体の感じを出しています。</p>
</div>

<button class="opener" id="opener">入力シートを見る</button>
<div class="scrim" id="scrim"></div>
<div class="input" id="input">
  <div class="ihead"><span class="who"><i style="background:var(--p3)"></i>けん</span><span class="rnd">ROUND 4 ・ 3/4</span></div>
  <div class="display"><span class="v">−12</span><span class="u">点</span></div>
  <div class="quick"><button>−10</button><button>−5</button><button>+5</button><button>+10</button></div>
  <div class="pad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button class="sign">＋/−</button><button>0</button><button class="del">けす</button>
  </div>
  <div class="ifoot"><button class="cancel" id="cancel">やめる</button><button class="ok">次の人へ →</button></div>
</div>
<script>
  const $=s=>document.querySelector(s);
  const open=()=>{$('#input').classList.add('on');$('#scrim').classList.add('on');$('#opener').style.display='none'};
  const close=()=>{$('#input').classList.remove('on');$('#scrim').classList.remove('on');$('#opener').style.display=''};
  if(location.hash==='#sheet')open();
  if(location.hash==='#plain')$('#opener').style.display='none';
  $('#opener').onclick=open;$('#scrim').onclick=close;$('#cancel').onclick=close;
</script>
</body>
</html>
